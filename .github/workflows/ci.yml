name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar is not committed; the action provisions Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Lint (ktlint)
        run: gradle ktlintCheck

      - name: Static analysis (detekt)
        run: gradle detekt

      - name: Unit tests
        run: gradle test

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truthguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
